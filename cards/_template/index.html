<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>賀卡標題（改我）</title>
<!-- OG 分享預覽：上線後 og:url / og:image 換成正式網域的絕對網址 -->
<meta property="og:title" content="賀卡標題（改我）">
<meta property="og:description" content="一句祝福（改我）">
<meta property="og:image" content="assets/share/poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Serif+TC:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../../css/card.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card-stage">
  <div class="card-scene">
    <h1 class="card-title" data-slot="title"></h1>
    <p class="card-subtitle" data-slot="subtitle"></p>
    <p class="card-greeting" data-slot="greeting"></p>
    <p class="card-signoff" data-slot="signoff"></p>
    <a class="card-reply" data-slot-link="reply" data-slot="replyText" href="#"></a>
  </div>
</main>
<p class="card-expired-note is-hidden">此為過往檔期賀卡，感謝觀賞 ✦</p>
<section class="card-info">
  <p class="card-note" data-slot="infoText"></p>
  <div class="card-promo"><!-- 曝光版品牌區塊放這裡；基本版保持空白即自動隱藏 --></div>
  <nav class="card-share">
    <a data-share="line" target="_blank" rel="noopener">分享到 LINE</a>
    <a data-share="copy" href="#">複製連結</a>
    <a data-share="download" download>下載影片</a>
  </nav>
</section>
<script src="../../../../scripts/gsap.min.js"></script>
<script src="config.js"></script>
<script src="anim.js"></script>
<script src="../../../../scripts/card.js"></script>
</body>
</html>
