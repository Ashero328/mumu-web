<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="松川珈琲 標誌">
  <!-- 松川珈琲的品牌標記：圓框內一株幾何化的松。
       只做「標記」不含字，字在 HTML 裡用網頁字體排 ——
       SVG 裡的文字會被使用者的系統字體影響，換一台電腦就走樣。
       換成真客戶的 logo 時，直接覆蓋這個檔案即可（維持 1:1 的視框）。 -->
  <g fill="none" stroke="#f2e9dd" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="28.6" stroke-width="1.6" opacity=".55"/>
    <path d="M23.5 27.5 L32 15.5 L40.5 27.5"/>
    <path d="M20.5 36.5 L32 21.5 L43.5 36.5"/>
    <path d="M17.5 45.5 L32 29.5 L46.5 45.5" stroke-width="2.6"/>
    <path d="M32 45.5 L32 52.5"/>
  </g>
</svg>
