<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="手沖吧檯 照片位置">
  <!-- ✏️ 照片佔位圖。換成真照片時，把這個檔案換成同名的 .jpg，
       並修改 index.html 裡對應的 <img src>。建議尺寸 1200×900（4:3）。 -->
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241c17"/>
      <stop offset="1" stop-color="#12100e"/>
    </linearGradient>
    <filter id="n4">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#g4)"/>
  <rect width="1200" height="900" filter="url(#n4)" opacity=".055"/>
  <g fill="none" stroke="#d98a3d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".5"
     transform="translate(600 392) scale(3.4) translate(-32 -32)">
    <path d="M23.5 27.5 L32 15.5 L40.5 27.5"/>
    <path d="M20.5 36.5 L32 21.5 L43.5 36.5"/>
    <path d="M17.5 45.5 L32 29.5 L46.5 45.5"/>
    <path d="M32 45.5 L32 52.5"/>
  </g>
  <text x="600" y="600" text-anchor="middle" fill="#f2e9dd" opacity=".72"
        font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="40" letter-spacing="6">手沖吧檯</text>
  <text x="600" y="648" text-anchor="middle" fill="#a3907f" opacity=".8"
        font-family="ui-monospace,'Consolas',monospace" font-size="24" letter-spacing="3">1200 × 900　照片位置</text>
  <rect x="24" y="24" width="1152" height="852" fill="none" stroke="#f2e9dd" stroke-opacity=".13" stroke-dasharray="10 12"/>
</svg>
