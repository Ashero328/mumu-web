<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ══════════════════════════════════════════════════════════════
     松川珈琲焙煎所 —— 客戶版賀卡「示意」

     客戶的東西一律收在 clients\<客戶代號>\，一家一包；
     cards\ 只放木木自己的範本卡（CH2026001、NE2026001）。

     跟 CH2026001（木木自己的範本卡）用同一套引擎、同一個版式，
     差別只在兩件事，這也正是賣給客戶時會換掉的兩件事：
       1. 風格與背景 → css/style.scss（改配色 token ＋ 換裝飾）
       2. 落款與底部的客戶 logo → 下面的 .card-signoff 與 .card-promo

     ⚠️ 松川珈琲焙煎所是**虛構的示範品牌**，內容全是假的。
     ══════════════════════════════════════════════════════════════ -->

<!-- ✏️ 可以改：這張卡的標題（瀏覽器分頁上顯示的字） -->
<title>Happy New Year｜松川珈琲焙煎所</title>

<!-- ══════════════════════════════════════════════════════════════
     ✏️ 可以改：檔期設定

     card-offline    這張卡的最後展示日，格式 2026-12-31
                     過了這天，整張卡自動收起，改成一頁「檔期已結束」的公告
                     留空 = 永遠不下架

     promo-offline   下面「客戶曝光區」的下架日，格式同上
                     過了這天，只有曝光區消失，賀卡本身照常
                     留空 = 不自動下架
     ══════════════════════════════════════════════════════════════ -->
<meta name="card-offline" content="">
<meta name="promo-offline" content="">

<!-- OG 分享預覽：LINE／FB 的爬蟲只讀原始碼、不執行網頁，所以這裡一定要絕對網址，
     相對路徑它找不到基準，抓不到預覽圖。正式網域生效後把這裡的網域換掉即可 -->
<meta property="og:type" content="website">
<meta property="og:title" content="Happy New Year｜松川珈琲焙煎所">
<meta property="og:description" content="謝謝這一年，每一杯都有你。新的一年，我們繼續為你顧好那一鍋火。">
<meta property="og:url" content="https://mumu-web.pages.dev/clients/songchuan/">
<meta property="og:image" content="https://mumu-web.pages.dev/clients/songchuan/images/poster.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Serif+TC:wght@400;500&display=swap">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="card-stage">
  <!-- 背景裝飾：焙煎鼓的圓、三道熱氣、幾點火光。
       跟聖誕卡的「花圈＋雪點」是同一個結構（一個圓＋幾顆點），換了語彙而已 -->
  <div class="card-deco" aria-hidden="true">
    <!-- 熱氣放在 .drum 裡面：這樣可以用 bottom: 100% 貼著圓的上緣，
         直式（圓在 30% 高）與橫式（圓在 12% 高）都自動對位，
         不必為兩種版式各寫一組座標 -->
    <span class="drum">
      <i class="steam"></i><i class="steam"></i><i class="steam"></i>
    </span>
    <i class="spark"></i><i class="spark"></i><i class="spark"></i>
    <i class="spark"></i><i class="spark"></i>
  </div>

  <div class="card-scene">
    <!-- ✏️ 可以改：大標題（英文，斜體那行） -->
    <h1 class="card-title">Happy New Year</h1>

    <!-- ✏️ 可以改：副標（中文，字距很開那行）。不需要就把這整行刪掉 -->
    <p class="card-subtitle">歲末感謝</p>

    <!-- ✏️ 可以改：祝福語 -->
    <p class="card-greeting">謝謝這一年，每一杯都有你。<br>新的一年，我們繼續為你顧好那一鍋火。</p>

    <!-- ✏️ 可以改：落款。**客戶版的重點之一**：這裡放客戶的名字，不是木木 -->
    <p class="card-signoff">松川珈琲焙煎所　敬賀</p>

    <!-- ✏️ 可以改：按鈕文字與連結。不需要這顆按鈕就把這整行刪掉
         href 填收卡人可以回覆的地方（LINE、表單網址…） -->
    <a class="card-reply" href="#">回覆祝福</a>
  </div>
</main>

<section class="card-info">
  <!-- ✏️ 可以改：卡片下方的說明文字 -->
  <p class="card-note">新年首鍋訂在初五開火。想指定豆子的話，年前先跟我們說一聲，開工那天就幫你留著。</p>

  <!-- ══════════════════════════════════════════════════════════════
       ✏️ 客戶曝光區 —— **這就是「底下的客戶 logo」**

       這裡放的是客戶自己的品牌落款：標記＋名稱＋一個連結。
       標記換成客戶的檔案（images/logo.svg），維持 1:1 的視框即可。

       不賣曝光的卡，把 <aside> 整段刪掉（留著空的也會自動隱藏）。
       原本的用法是掛一張 banner 圖，那個版本的寫法留在 CH2026001 裡。
       ══════════════════════════════════════════════════════════════ -->
  <aside class="card-promo card-promo--brand">
    <a href="#" target="_blank" rel="noopener">
      <img class="card-promo__mark" src="images/logo.svg" alt="" width="64" height="64">
      <span class="card-promo__text">
        <strong>松川珈琲焙煎所</strong>
        <small>SONGCHUAN COFFEE ROASTERS</small>
      </span>
    </a>
  </aside>

  <nav class="card-share">
    <a data-share="line" target="_blank" rel="noopener">分享到 LINE</a>
    <a data-share="copy" href="#">複製連結</a>
    <!-- 有影片檔才留這行，href 填影片位置；沒有就刪掉 -->
    <!-- <a data-share="download" href="images/card.mp4" download>下載影片</a> -->
  </nav>

  <!-- ⚠️ 這是示意卡，接真客戶時把這一行刪掉 -->
  <p class="card-demo">本卡為版型示意，品牌名稱與內容均為虛構。</p>
</section>

<!-- 檔期結束後才會出現的公告頁（平常整段隱藏，不用管它） -->
<section class="expired" aria-live="polite">
  <div class="expired__inner">
    <span class="expired__seal" aria-hidden="true">木</span>
    <h1 class="expired__title">這張賀卡的檔期<br>已經結束了</h1>
    <p class="expired__text">謝謝您特地前來。<br>木木文化每逢節慶都會做新的電子賀卡，歡迎再來看看。</p>
    <div class="expired__actions">
      <a class="expired__btn expired__btn--solid" href="../../">看看最新的賀卡</a>
      <a class="expired__btn" href="https://line.me/R/ti/p/@yme1248q">聊聊客製賀卡</a>
    </div>
  </div>
  <p class="expired__vertical" aria-hidden="true">紙 上 有 溫 度</p>
</section>

<script src="scripts/gsap/gsap.min.js"></script>
<script src="scripts/anim.js"></script>
<script src="scripts/card.js"></script>
</body>
</html>
